# Ablation levels (thesis Table 2.3) and the context sources behind them (Table 3.1).
# A level is defined only by which MCP servers and custom tools are enabled
# (requirement R3); the prompt, model and temperature never change.
#
# MCP server versions used: awslabs.cloudwatch-mcp-server 0.3.1, awslabs.iam-mcp-server 1.1.2
# (record in Appendix G). The IaC layer uses custom tools: the AWS CloudFormation MCP server
# was withdrawn, and its successor (awslabs.aws-iac-mcp-server) only validates templates and
# searches documentation; it cannot read the live configuration of deployed resources.

mcp_servers:
  # Installed once into .mcp-venv (see README) so that the versions are pinned and recorded
  # in Appendix G; the command is looked up in .mcp-venv first, then on PATH.
  cloudwatch:
    command: awslabs.cloudwatch-mcp-server
    args: []
  iam:
    # read-only by default; write operations would need --allow-write
    command: awslabs.iam-mcp-server
    args: []

# Defence in depth on top of the read-only role and read-only server defaults (Section 8.1):
# any MCP tool whose name starts with one of these prefixes is never given to the agent.
blocked_tool_prefixes:
  [create, delete, put, update, attach, detach, add, remove, tag, untag, invoke, run, start, stop, set, enable, disable]

# Custom tools implemented in src/lambda_rca/agent/tools/
custom_tools:
  iac_template: [read_iac_template]                       # intended state (template file)
  live_config: [read_live_configuration]                  # live state (read-only Lambda API)
  code: [list_commits, show_commit, read_source_file]    # source code and git history

levels:
  L0:
    description: Raw logs in the prompt, no tools
    raw_logs_in_prompt: true
    mcp: []
    custom: []
  L1:
    description: Telemetry tools (metrics, logs)
    mcp: [cloudwatch]
    custom: []
  L2:
    description: L1 + IAM policies
    mcp: [cloudwatch, iam]
    custom: []
  L3:
    description: L2 + IaC template and live configuration
    mcp: [cloudwatch, iam]
    custom: [iac_template, live_config]
  L4:
    description: L3 + source code and git history
    mcp: [cloudwatch, iam]
    custom: [iac_template, live_config, code]
